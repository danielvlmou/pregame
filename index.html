<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PreGame</title>
<style>
  :root { --bg:#0e0e0f; --card:#18181a; --text:#f4f4f5; --subtle:#b3b3b3; --lime:#c7ff3d; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  main { max-width:760px; margin:0 auto; padding:40px 20px 80px; }
  h1 { font-size:30px; line-height:1.2; margin:0 0 6px; }
  h2 { font-size:21px; margin:34px 0 10px; color:var(--lime); }
  h3 { font-size:17px; margin:22px 0 6px; }
  p, li { color:#e4e4e7; }
  a { color:var(--lime); word-break:break-word; }
  hr { border:0; border-top:1px solid #2a2a2e; margin:30px 0; }
  blockquote { margin:16px 0; padding:12px 16px; background:var(--card); border-left:3px solid var(--lime); border-radius:8px; }
  table { width:100%; border-collapse:collapse; margin:12px 0; font-size:15px; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid #2a2a2e; vertical-align:top; }
  th { color:var(--subtle); font-weight:600; }

  .btn { display:inline-block; background:var(--lime); color:#111; font-weight:700; padding:12px 20px; border-radius:999px; text-decoration:none; margin:6px 8px 6px 0; }
</style>
</head>
<body>
<main>
<h1>PreGame</h1>
<p>Festens spil til forfesten – 11 spil, hvor alle spiller med på hver deres telefon.</p>
<p><a class="btn" href="privacy.html">Privatlivspolitik</a><a class="btn" href="support.html">Support</a></p>
</main>
</body>
</html>
